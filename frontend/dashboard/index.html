<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VayuRaksha Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <h1>VayuRaksha</h1>
          <p>Air intelligence command center</p>
        </div>
      </div>
      <section class="panel compact">
        <div class="metric">
          <span>Test R2</span>
          <strong id="metric-r2">--</strong>
        </div>
        <div class="metric">
          <span>Hotspot F1</span>
          <strong id="metric-f1">--</strong>
        </div>
        <div class="metric">
          <span>Baseline Lift</span>
          <strong id="metric-lift">--</strong>
        </div>
      </section>
      <section class="panel">
        <h2>Layer Control</h2>
        <label><input id="toggle-aqi" type="checkbox" checked /> AQI prediction</label>
        <label><input id="toggle-hotspots" type="checkbox" checked /> HCHO hotspots</label>
        <label><input id="toggle-uncertainty" type="checkbox" checked /> Uncertainty radius</label>
      </section>
      <section class="panel">
        <h2>Regional Watch</h2>
        <div id="region-list" class="region-list"></div>
      </section>
    </aside>
    <main class="workspace">
      <header class="toolbar">
        <div>
          <h2>India AQI Forecast Grid</h2>
          <p id="status">Loading model artifacts...</p>
        </div>
        <div class="toolbar-actions">
          <button id="refresh-btn" type="button">Refresh</button>
          <button id="export-btn" type="button">Export GeoJSON</button>
        </div>
      </header>
      <section class="map-shell">
        <div id="map"></div>
        <div id="legend" class="legend"></div>
      </section>
      <section class="analytics">
        <div class="chart-panel"><div id="aqi-chart"></div></div>
        <div class="chart-panel"><div id="hotspot-chart"></div></div>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
