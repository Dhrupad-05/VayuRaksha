apiVersion: apps/v1
kind: Deployment
metadata:
  name: vayuraksha-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vayuraksha-api
  template:
    metadata:
      labels:
        app: vayuraksha-api
    spec:
      containers:
        - name: api
          image: vayuraksha:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vayuraksha-api
spec:
  type: LoadBalancer
  selector:
    app: vayuraksha-api
  ports:
    - port: 80
      targetPort: 8000

